<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css?_=12">
  <title>Prompt Generator</title>
</head>

<body>

  <div class="header d-flex mb-2 gap-2">
    <!-- <div>
      <a href="/">🏠︎</a>
    </div> -->
    <!-- <div class="text-white">/</div> -->
    <h1 class="m-0 text-white">Prompt Generator</h1>
    <div class="flex-grow"></div>
    <div class="author">bigsupp@gmail.com</div>
  </div>

  <div class="grid-parent">

    <div class="grid">
      <div class="col-block">
        <div class="d-flex align-items-center mb-1 gap-1">
          <div class="numbered">1</div>
          <h1><label for="templateSelect">Template</label></h1>
          <select id="templateSelect" class="flex-grow">
            <option value="">Loading templates...</option>
          </select>
        </div>
        <div class="template-preview">
          <pre id="templatePreview">// Select a template.</pre>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="col-block">
        <div class="d-flex align-items-center mb-1 gap-1">
          <div class="numbered">2</div>
          <h1>Variables</h1>
        </div>
        <div id="variablesContainer">No variables yet.</div>
        <div class="d-flex">
          <button id="generateButton" type="button">&#x25BA; Generate</button>
          <div class="flex-grow"></div>
          <button id="resetButton" type="button">&#x21BA; Reset</button>
        </div>
      </div>
      <div id="presetButtons" class="d-flex gap-1">
        <button value="generate mermaid diagram">generate sequence diagram in mermaid diagram syntax</button>
        <button value="use official document">use official document as source of truth</button>
      </div>
    </div>

    <div class="grid">
      <div class="col-block">
        <div class="d-flex align-items-center mb-1 gap-1">
          <div class="numbered">3</div>
          <h1>Generated Prompt</h1>
        </div>
        <div class="d-flex align-items-center mb-1 gap-1">
          <button id="copyButton" type="button">Copy to Clipboard</button>
          <span id="copyStatus" aria-live="polite"></span>
        </div>
        <textarea id="output" rows="12" readonly></textarea>
      </div>
    </div>

  </div>

  <script src="app.js?v=32"></script>
</body>

</html>
